[package]
name = "calcpad-caskit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly binding of the caskit symbolic algebra library for the Symbolic dialog of the CivilKit Calcs web app, loaded on demand"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
civilkit-calcs-caskit = { path = "../caskit" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
serde_json = "1"
